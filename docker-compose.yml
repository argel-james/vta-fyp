services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gvc-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Mount data & index so the container uses your local course files
      - ./backend/data:/app/data
      - ./backend/index:/app/index
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # For local testing, the browser calls the backend via localhost
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: gvc-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
