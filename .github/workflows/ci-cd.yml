name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_LOGIN_SERVER: vtacontainerreg.azurecr.io
  BACKEND_IMAGE: vtacontainerreg.azurecr.io/vta-backend
  FRONTEND_IMAGE: vtacontainerreg.azurecr.io/vta-frontend

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Backend tests (pytest)
  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          VTA_DATABASE_URL: "sqlite:///:memory:"
          VTA_SECRET_KEY: "ci-test-secret-key"
          VTA_EMAIL_CONNECTION_STR: "ci-test"
          VTA_FROM_EMAIL: "ci@test.com"
        run: pytest --tb=short -q

  # ─────────────────────────────────────────────────────────────
  # Job 2: Frontend checks (type-check + lint + build)
  # ─────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=50

  # ─────────────────────────────────────────────────────────────
  # Job 3: Build Docker images, push to ACR, deploy to App Service
  # ─────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=https://vta-backend-app.azurewebsites.net
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy backend container
        run: |
          BACKEND_USER=$(echo '${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}' | grep -o 'userName="[^"]*"' | head -1 | cut -d'"' -f2)
          BACKEND_PASS=$(echo '${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}' | grep -o 'userPWD="[^"]*"' | head -1 | cut -d'"' -f2)

          curl -s -X POST \
            "https://vta-backend-app.scm.azurewebsites.net/api/settings" \
            -u "${BACKEND_USER}:${BACKEND_PASS}" \
            -H "Content-Type: application/json" \
            -d '{"DOCKER_CUSTOM_IMAGE_NAME":"${{ env.BACKEND_IMAGE }}:${{ github.sha }}","DOCKER_REGISTRY_SERVER_URL":"https://${{ env.ACR_LOGIN_SERVER }}","DOCKER_REGISTRY_SERVER_USERNAME":"${{ secrets.ACR_USERNAME }}","DOCKER_REGISTRY_SERVER_PASSWORD":"${{ secrets.ACR_PASSWORD }}"}'

          echo "Backend container image updated"

      - name: Deploy frontend container
        run: |
          FRONTEND_USER=$(echo '${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}' | grep -o 'userName="[^"]*"' | head -1 | cut -d'"' -f2)
          FRONTEND_PASS=$(echo '${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}' | grep -o 'userPWD="[^"]*"' | head -1 | cut -d'"' -f2)

          curl -s -X POST \
            "https://vta-frontend-app.scm.azurewebsites.net/api/settings" \
            -u "${FRONTEND_USER}:${FRONTEND_PASS}" \
            -H "Content-Type: application/json" \
            -d '{"DOCKER_CUSTOM_IMAGE_NAME":"${{ env.FRONTEND_IMAGE }}:${{ github.sha }}","DOCKER_REGISTRY_SERVER_URL":"https://${{ env.ACR_LOGIN_SERVER }}","DOCKER_REGISTRY_SERVER_USERNAME":"${{ secrets.ACR_USERNAME }}","DOCKER_REGISTRY_SERVER_PASSWORD":"${{ secrets.ACR_PASSWORD }}"}'

          echo "Frontend container image updated"

      - name: Verify deployments
        run: |
          echo "Waiting 60s for containers to start..."
          sleep 60

          BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://vta-backend-app.azurewebsites.net/health || echo "000")
          echo "Backend health: $BACKEND_STATUS"

          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://vta-frontend-app.azurewebsites.net/ || echo "000")
          echo "Frontend health: $FRONTEND_STATUS"

          if [ "$BACKEND_STATUS" != "200" ]; then
            echo "::warning::Backend returned $BACKEND_STATUS — may still be starting"
          fi
          if [ "$FRONTEND_STATUS" != "200" ]; then
            echo "::warning::Frontend returned $FRONTEND_STATUS — may still be starting"
          fi
